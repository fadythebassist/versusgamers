<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi Duel</title>
<meta name="description" content="Lexi Duel: find the hidden five-letter word in six tries, in English or French. A Versus Gamers original.">
<meta name="theme-color" content="#090B1A">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <div class="bg" id="bg" aria-hidden="true"></div>

  <!-- Title screen -->
  <section id="screen-title" class="screen screen-title" aria-labelledby="logo">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn lang-btn" data-action="lang" data-i18n-aria="langAria"><span data-i18n="langShort">FR</span></button>
        <button type="button" class="icon-btn" data-action="sound" data-sound-btn>
          <svg class="ico ico-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ico ico-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" data-action="settings" data-i18n-aria="settings">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>

    <div class="title-body">
      <div class="title-main">
        <h1 id="logo" class="logo" aria-label="Lexi Duel">
          <span class="logo-row logo-row-1" aria-hidden="true">
            <span class="tile" data-state="correct">L</span><span class="tile" data-state="present">E</span><span class="tile" data-state="absent">X</span><span class="tile" data-state="correct">I</span>
          </span>
          <span class="logo-row logo-row-2" aria-hidden="true">
            <span class="tile" data-state="present">D</span><span class="tile" data-state="absent">U</span><span class="tile" data-state="correct">E</span><span class="tile" data-state="correct">L</span>
          </span>
        </h1>
        <p class="tagline" data-i18n="tagline"></p>

        <div class="modes" role="group" aria-labelledby="modes-h">
          <h2 id="modes-h" class="modes-h" data-i18n="chooseMode"></h2>
          <button type="button" id="btn-daily" class="mode-btn mode-daily" data-action="daily">
            <span class="mode-name" data-i18n="daily"></span>
            <span class="mode-desc" id="daily-desc"></span>
            <span class="mode-stat" id="daily-stat"></span>
          </button>
          <button type="button" id="btn-endless" class="mode-btn mode-endless" data-action="endless">
            <span class="mode-name" data-i18n="endless"></span>
            <span class="mode-desc" id="endless-desc"></span>
            <span class="mode-stat" id="endless-stat"></span>
          </button>
          <p class="load-msg" id="load-msg" role="status" aria-live="polite"></p>
        </div>
      </div>

      <aside class="howto" aria-labelledby="howto-h">
        <h2 id="howto-h" data-i18n="howTitle"></h2>
        <p data-i18n="how1"></p>
        <ul class="legend">
          <li><span class="tile mini" data-state="correct" aria-hidden="true">C</span><span data-i18n="legCorrect"></span></li>
          <li><span class="tile mini" data-state="present" aria-hidden="true">A</span><span data-i18n="legPresent"></span></li>
          <li><span class="tile mini" data-state="absent" aria-hidden="true">T</span><span data-i18n="legAbsent"></span></li>
        </ul>
        <p data-i18n="how2"></p>
        <p class="howto-small" data-i18n="how3"></p>
      </aside>
    </div>
  </section>

  <!-- Game screen -->
  <section id="screen-game" class="screen screen-game" hidden>
    <header class="topbar game-bar">
      <button type="button" class="icon-btn" data-action="menu" data-i18n-aria="menu">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" fill="currentColor"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" fill="currentColor" opacity=".45"/></svg>
      </button>
      <div class="status" id="status">
        <span class="status-mode" id="status-mode"></span>
        <span class="status-sub" id="status-sub"></span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" data-action="pause" data-i18n-aria="pauseAria">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" data-action="sound" data-sound-btn>
          <svg class="ico ico-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ico ico-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn lang-btn" data-action="lang" data-i18n-aria="langAria"><span data-i18n="langShort">FR</span></button>
      </div>
    </header>

    <main class="play" id="play">
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="group" data-i18n-aria="boardAria"></div>
        <div class="toast" id="toast" aria-hidden="true"></div>
      </div>
      <div class="round-bar" id="round-bar" hidden>
        <button type="button" class="btn btn-ghost" data-action="results" data-i18n="showResults"></button>
        <button type="button" class="btn btn-primary" id="round-next" data-action="next"></button>
      </div>
      <div class="keyboard" id="keyboard" role="group" data-i18n-aria="keyboardAria"></div>
    </main>

    <div class="pause-layer" id="pause" hidden>
      <div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-h">
        <h2 id="pause-h" data-i18n="paused"></h2>
        <p class="pause-hint" data-i18n="pauseHint"></p>
        <button type="button" class="btn btn-primary" data-action="resume" data-i18n="resume"></button>
        <button type="button" class="btn btn-ghost" data-action="settings" data-i18n="settings"></button>
        <button type="button" class="btn btn-ghost" data-action="menu" data-i18n="menu"></button>
      </div>
    </div>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div>
  </div>

  <div class="sr-only" id="sr-live" aria-live="polite"></div>
</div>
<script src="game.js"></script>
</body>
</html>
